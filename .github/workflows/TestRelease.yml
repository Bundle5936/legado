name: GitHub APK Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit on master to build
        required: false
        type: string

concurrency:
  group: github-apk-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:

  prepare:
    if: ${{ github.repository == 'Bundle5936/legado' && !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      versionCode: ${{ steps.set-ver.outputs.versionCode }}
      tag: ${{ steps.set-ver.outputs.tag }}
      commit: ${{ steps.set-ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}

      - id: set-ver
        env:
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
            ! git merge-base --is-ancestor "$COMMIT_SHA" origin/master; then
            echo "Commit must belong to master: $COMMIT_SHA"
            exit 1
          fi
          commit_epoch=$(git show -s --format=%ct "$COMMIT_SHA")
          version="3.$(TZ=Asia/Shanghai date -d "@$commit_epoch" +%y%m%d%H)"
          base_commit=$(sed -n "s/^def versionCodeBaseCommit = '\([^']*\)'.*/\1/p" app/build.gradle)
          base_code=$(awk '/^def versionCodeAtBase = / { print $4 }' app/build.gradle)
          if [[ ! "$base_commit" =~ ^[0-9a-f]{40}$ ]] || \
            [[ ! "$base_code" =~ ^[0-9]+$ ]]; then
            echo "Unable to read version-code base from app/build.gradle"
            exit 1
          fi
          commit_count=$(git rev-list "${base_commit}..HEAD" --count --no-merges)
          version_code=$((base_code + commit_count))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "versionCode=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=self-${version_code}-${COMMIT_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"


  build:
    needs: prepare
    strategy:
      matrix:
        product: [app]
        type: [release, releaseA]
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      product: ${{ matrix.product }}
      type: ${{ matrix.type }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prepare Assets
        run: echo "" > "$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt"

      - name: 使用当前自用版本的签名
        run: |
          cp .github/workflows/legado.jks app/legado.jks
          cat >> gradle.properties <<'PROPERTIES'
          RELEASE_STORE_FILE=./legado.jks
          RELEASE_KEY_ALIAS=legado
          RELEASE_STORE_PASSWORD=gedoor_legado
          RELEASE_KEY_PASSWORD=gedoor_legado
          PROPERTIES

      - name: 单元测试
        if: matrix.type == 'release'
        run: bash ./gradlew :app:testAppReleaseUnitTest --build-cache --parallel --daemon

      - name: Build With Gradle
        run: |
          sed -i "s/^def version = .*/def version = \"$VERSION\"/" \
            "$GITHUB_WORKSPACE/app/build.gradle"

          if [ "$type" = "release" ]; then
            typeName="release"
          else
            typeName="releaseA"
            sed -i "s/'.release'/'.releaseA'/" \
              "$GITHUB_WORKSPACE/app/build.gradle"
            if [ -f "$GITHUB_WORKSPACE/app/google-services.json" ]; then
              sed -i 's/.release/.releaseA/' \
                "$GITHUB_WORKSPACE/app/google-services.json"
            fi
          fi

          chmod +x gradlew
          ./gradlew :$product:assembleRelease -ParmOnly=true \
            --build-cache --parallel --daemon --warning-mode all
          mkdir -p "$GITHUB_WORKSPACE/apk"
          bash "$GITHUB_WORKSPACE/.github/scripts/collect-apks.sh" \
            "$GITHUB_WORKSPACE/app/build/outputs/apk" \
            "$GITHUB_WORKSPACE/apk" \
            "$product" "$VERSION" "$typeName" arm

          ./gradlew :$product:assembleRelease \
            --build-cache --parallel --daemon --warning-mode all
          bash "$GITHUB_WORKSPACE/.github/scripts/collect-apks.sh" \
            "$GITHUB_WORKSPACE/app/build/outputs/apk" \
            "$GITHUB_WORKSPACE/apk" \
            "$product" "$VERSION" "$typeName" universal

      - name: Check Build Result
        run: |
          expected_packages=(arm universal)
          mapfile -d '' apks < <(find "$GITHUB_WORKSPACE/apk" -maxdepth 1 \
            -type f -name 'legado_*.apk' -print0)
          if [[ ${#apks[@]} -ne ${#expected_packages[@]} ]]; then
            echo "Expected ${#expected_packages[@]} APKs, found ${#apks[@]}"
            exit 1
          fi

          declare -A verified=()
          for apk in "${apks[@]}"; do
            file_name=$(basename "$apk")
            case "$file_name" in
              *_universal_*) package_kind=universal ;;
              *) package_kind=arm ;;
            esac
            if [[ -n "${verified[$package_kind]:-}" ]]; then
              echo "Multiple APKs detected for $package_kind"
              exit 1
            fi

            packaged_abis=$(unzip -Z1 "$apk" \
              | sed -n 's#^lib/\([^/]*\)/.*#\1#p' \
              | sort -u \
              | paste -sd ' ' -)
            if [[ "$package_kind" = "universal" ]]; then
              expected_native_abis="arm64-v8a armeabi-v7a x86 x86_64"
            else
              expected_native_abis="arm64-v8a armeabi-v7a"
            fi
            if [[ "$packaged_abis" != "$expected_native_abis" ]]; then
              echo "$package_kind APK contains unexpected native ABIs: $packaged_abis"
              exit 1
            fi
            verified[$package_kind]=$apk
          done

          for package_kind in "${expected_packages[@]}"; do
            if [[ -z "${verified[$package_kind]:-}" ]]; then
              echo "Missing APK for $package_kind"
              exit 1
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: legado.self.${{ env.type }}
          if-no-files-found: error
          path: ${{ github.workspace }}/apk/*.apk

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.versionCode }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          pattern: legado.self.*
          merge-multiple: true
          path: apk

      - name: 核对发布文件并生成说明
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apk -maxdepth 1 -type f -name '*.apk' -print0)
          test "${#apks[@]}" -eq 4
          for apk in "${apks[@]}"; do
            mv -- "$apk" "${apk%.apk}_vc${VERSION_CODE}.apk"
          done
          (cd apk && sha256sum *.apk > SHA256SUMS.txt)
          {
            printf '<!-- legado-version-code:%s -->\n' "$VERSION_CODE"
            printf '本仓库自用构建，提交 `%s`。\n\n' "$COMMIT_SHA"
            printf '普通手机下载带 `release` 且不带 `universal` 的 APK；共存版选择 `releaseA`。\n\n'
            printf '沿用本仓库现有签名，可覆盖此前本仓库测试构建。\n\n'
            bash .github/scripts/extract-latest-update.sh app/src/main/assets/updateLog.md
          } > release-notes.md

      - name: 发布到本仓库 Releases
        run: |
          set -euo pipefail
          # 同一提交重跑时复用草稿；已发布版本保留，不覆盖历史文件。
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add' > releases.json
          release_state=$(jq -r --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag)] | if length == 0 then "missing" elif .[0].draft then "draft" else "published" end' releases.json)
          if [ "$release_state" = published ]; then
            echo "该提交已经发布，保留现有版本。"
            echo "发布地址：https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$release_state" = missing ]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" --draft \
              --title "阅读自用版 $VERSION · $VERSION_CODE" --notes-file release-notes.md
          else
            target=$(jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .target_commitish' releases.json)
            test "$target" = "$COMMIT_SHA"
          fi
          gh release upload "$RELEASE_TAG" apk/*.apk apk/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          # 手动发布旧提交时不覆盖主线最新版本的 Latest 标记。
          latest=false
          master_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$master_sha" = "$COMMIT_SHA" ]; then latest=true; fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest="$latest" --notes-file release-notes.md
          echo "发布地址：https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
